<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Housing Demand Forecaster</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Local housing market dashboard</p>
        <h1>Housing Demand Forecaster</h1>
      </div>
      <button id="refreshButton" type="button">Refresh Data</button>
    </header>

    <main>
      <section class="status-row" id="status">Loading public FRED data...</section>

      <section class="metric-grid" aria-label="Latest housing market values">
        <article class="metric-card">
          <div class="metric-label">
            <span>Housing Starts</span>
            <span
              class="info-icon"
              tabindex="0"
              aria-label="Housing starts definition"
              data-tooltip="Privately owned new housing units started, reported at a seasonally adjusted annual rate."
            >i</span>
          </div>
          <strong id="housingStarts">--</strong>
        </article>
        <article class="metric-card">
          <div class="metric-label">
            <span>Building Permits</span>
            <span
              class="info-icon"
              tabindex="0"
              aria-label="Building permits definition"
              data-tooltip="New privately owned housing units authorized by building permits, reported at a seasonally adjusted annual rate."
            >i</span>
          </div>
          <strong id="buildingPermits">--</strong>
        </article>
        <article class="metric-card">
          <div class="metric-label">
            <span>30-Year Mortgage</span>
            <span
              class="info-icon"
              tabindex="0"
              aria-label="30-year mortgage rate definition"
              data-tooltip="Average contract interest rate for a 30-year fixed-rate mortgage in the United States."
            >i</span>
          </div>
          <strong id="mortgageRate">--</strong>
        </article>
        <article class="metric-card">
          <div class="metric-label">
            <span>Home Price Index</span>
            <span
              class="info-icon"
              tabindex="0"
              aria-label="Home price index definition"
              data-tooltip="S&P CoreLogic Case-Shiller U.S. National Home Price Index, tracking changes in single-family home prices."
            >i</span>
          </div>
          <strong id="homePriceIndex">--</strong>
        </article>
      </section>

      <section class="dashboard-grid">
        <div class="panel chart-panel">
          <div class="panel-header">
            <h2>Monthly Trends</h2>
            <p id="latestDate"></p>
          </div>
          <div class="chart-frame">
            <canvas id="housingChart"></canvas>
          </div>
        </div>

        <aside class="panel forecast-panel">
          <h2>Model Forecast</h2>
          <div id="forecastOutput" class="forecast-output">Training model...</div>
          <div id="featureImportance" class="feature-list"></div>
        </aside>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Analyst Insights</h2>
          <p>Rule-based commentary from the latest data.</p>
        </div>
        <div id="insightsList" class="insights-list"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
